<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>PollPulse | Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <a th:href="@{/}" class="logo">Poll<span>Pulse.</span></a>
    <h1>Welcome back</h1>
    <p class="auth-subtitle">Sign in to PollPulse</p>
    <div th:if="${param.registered}" class="alert alert-success">Account created successfully. Please sign in.</div>
    <div th:if="${param.error}" class="alert alert-error">Invalid email or password.</div>
    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>Email<input name="email" type="email" required></label>
        <label>Password<input name="password" type="password" required></label>
        <button type="submit">Sign in</button>
    </form>
    <p class="auth-link">New to PollPulse? <a th:href="@{/register}">Create an account</a></p>
</main>
</body>
</html>
